<title>껴보링</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 껴보링: 손 영상이 화면 가득, 위에 떠 있는 유리 같은 컨트롤, 흑백 톤 (토스 규칙상 라이트 모드만) */
:root{--ink:#111111;--sub:#86868b;--line:rgba(0,0,0,.09);--glass:rgba(255,255,255,.78);--tile:#f4f3f1;
--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e9e7e4;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;letter-spacing:-0.2px}
.app{position:relative;width:100%;max-width:440px;height:100%;margin:0 auto;overflow:hidden;background:#e9e7e4}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100%,calc(100vh*480/854));aspect-ratio:480/854;overflow:hidden;background:#ddd}
.zw{position:absolute;inset:0;transform-origin:0 0;transition:transform .25s ease}
.box img,.box canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tools{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.seg{display:inline-flex;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:999px;padding:3px;flex:none;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.seg button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:none;color:var(--sub);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pick{position:relative;display:inline-flex;align-items:center;gap:5px;flex:none;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:999px;padding:0 28px 0 13px;height:36px;box-shadow:0 1px 8px rgba(0,0,0,.06);font-size:12.5px}
.pick span{color:var(--sub);font-weight:500}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;font-weight:600;color:var(--ink);padding:0;cursor:pointer;outline:none}
.pick::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.chip{height:36px;font:inherit;font-size:12.5px;font-weight:500;border:0;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink);padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.08);padding:6px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.grab{display:block;width:34px;height:4px;border-radius:2px;background:rgba(0,0,0,.18);margin:0 auto}
.grab-btn{display:block;width:100%;border:0;background:none;padding:4px 0 10px;cursor:pointer;font:inherit;color:var(--ink);touch-action:none}
.grab-t{display:none;font-size:13.5px;font-weight:500;margin-top:8px}
.sheet.collapsed .grab-t{display:block}
.sheet.collapsed #pList,.sheet.collapsed #pDetail{display:none!important}
.tabs{display:flex;gap:18px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:none;color:var(--sub);padding:6px 0;cursor:pointer;white-space:nowrap;border-bottom:1.5px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.wheel{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px calc(50% - 41px) 2px;scrollbar-width:none}
.wheel::-webkit-scrollbar{display:none}
.card{flex:0 0 78px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:var(--sub);cursor:pointer;padding:0;transform-origin:50% 70%;transition:transform .12s}
.card img{width:62px;height:62px;border-radius:50%;background:#fff;display:block;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.card .n{font-size:11.5px;font-weight:500;white-space:nowrap}
.card[aria-current="true"] img{box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ink)}
.card[aria-current="true"] .n{color:var(--ink);font-weight:600}
.picked{display:none}
#b-detail{margin-top:14px}
.primary{display:block;width:calc(100% - 40px);margin:0 20px;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:999px;padding:15px;background:var(--ink);color:#fff;cursor:pointer;letter-spacing:-0.1px}
.sh-head{display:flex;align-items:baseline;gap:8px;padding:2px 14px 8px}
.sh-head button{font:inherit;font-size:22px;line-height:1;border:0;background:none;color:var(--ink);padding:2px 6px;cursor:pointer}
.sh-head b{font-size:17px;font-weight:600}
.sh-head span{color:var(--sub);font-size:12.5px}
.dbody{max-height:36vh;overflow-y:auto;padding:0 20px 12px}
.grp{padding:9px 0;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.gl{font-size:12px;color:var(--sub);margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);padding:8px 13px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink);font-weight:600}
.chips i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#solinfo{font-size:12.5px;color:var(--ink);font-weight:500;margin-top:8px}
[hidden]{display:none!important}
</style>
<div class="app">
<div class="tools">
<label class="pick"><span>조명</span><select id="s-light" aria-label="조명"><option value="office" selected>실내</option><option value="store">매장</option><option value="sun">햇빛</option></select></label>
<label class="pick"><span>내 호수</span><select id="s-ho" aria-label="내 반지 호수"><option value="5">5호</option><option value="5.5">5.5호</option><option value="6">6호</option><option value="6.5">6.5호</option><option value="7">7호</option><option value="7.5">7.5호</option><option value="8">8호</option><option value="8.5">8.5호</option><option value="9">9호</option><option value="9.5">9.5호</option><option value="10">10호</option><option value="10.5">10.5호</option><option value="11">11호</option><option value="11.5">11.5호</option><option value="12">12호</option><option value="12.5">12.5호</option><option value="13">13호</option><option value="13.5">13.5호</option><option value="14">14호</option><option value="14.5">14.5호</option><option value="15">15호</option><option value="15.5">15.5호</option><option value="16">16호</option><option value="16.5">16.5호</option><option value="17">17호</option><option value="17.5" selected>17.5호</option><option value="18">18호</option><option value="18.5">18.5호</option><option value="19">19호</option><option value="19.5">19.5호</option><option value="20">20호</option><option value="20.5">20.5호</option><option value="21">21호</option><option value="21.5">21.5호</option><option value="22">22호</option><option value="22.5">22.5호</option><option value="23">23호</option><option value="23.5">23.5호</option><option value="24">24호</option><option value="24.5">24.5호</option><option value="25">25호</option></select></label>
<button class="chip" id="b-zoom" aria-pressed="false">가까이</button>
</div>
<div class="stage" id="stage"><div class="box" id="box"><div class="zw" id="zw"><img id="img" alt="왼손 사진 위에 고른 반지"><div id="tint" style="position:absolute;inset:0;pointer-events:none"></div><canvas id="sh"></canvas><canvas id="out"></canvas></div></div></div>
<input type="range" id="r" min="0" value="0" hidden aria-hidden="true">
<section class="sheet" id="sheet" aria-label="반지 고르기">
<button class="grab-btn" id="b-grab" aria-label="반지 고르기 접기" aria-expanded="true"><span class="grab"></span><span class="grab-t" id="grabtxt"></span></button>
<div id="pList">
<div id="tabs" hidden></div>
<div class="wheel" id="wheel"></div>
<div class="picked" id="picked"></div>
<button class="primary" id="b-detail">이 반지 자세히 설정</button>
</div>
<div id="pDetail" hidden>
<div class="sh-head"><button id="b-back" aria-label="반지 목록으로">‹</button><b id="dname"></b><span id="dsub"></span></div>
<div class="dbody">
<div class="grp" id="g-metal"><div class="gl">색상</div><div class="chips" id="c-metal"></div></div>
<div class="grp" id="g-w"><div class="gl">폭</div><div class="chips" id="c-w"></div></div>
<div class="grp" id="g-pave"><div class="gl">파베</div><div class="chips" id="c-pave"></div></div>
<div class="grp" id="g-th"><div class="gl">두께</div><div class="chips" id="c-th"></div></div>
<div id="g-sol">
<div class="grp" id="g-cut"><div class="gl">컷</div><div class="chips" id="c-cut"></div></div>
<div class="grp" id="g-pr"><div class="gl">발</div><div class="chips" id="c-pr"></div></div>
<div class="grp" id="g-ct"><div class="gl">캐럿</div><div class="chips" id="c-ct"></div></div>
<div class="grp"><div class="gl">알</div><div class="chips" id="c-gem"></div><div id="solinfo"></div></div>
</div>
<div class="grp"><div class="gl">가드링 (얇은 링 하나 더)</div><div class="chips" id="c-gw"></div><div class="chips" id="c-gp" style="margin-top:6px"></div><div class="chips" id="c-gm" style="margin-top:6px"></div></div>
</div>
<button class="primary" id="b-done">완료</button>
</div>
</section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
